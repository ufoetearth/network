<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>網路課教學箱</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky top bar (version switch) + left unit rail + main stage; rail becomes a scrolling chip row on phones */
:root{
  --bg:#eef3f6; --surface:#ffffff; --sunk:#e3eaf0; --ink:#13283b; --muted:#5b6d7e; --line:#cfdae3;
  --primary:#1f5fa3; --primary-ink:#ffffff; --primary-soft:#dce9f7;
  --signal:#e07a00; --signal-soft:#fdebd3;
  --ok:#23813a; --ok-soft:#dcf2e1; --bad:#c42b2b; --bad-soft:#f9dede;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px; --scale:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1824; --surface:#142434; --sunk:#0f1d2b; --ink:#e3ecf4; --muted:#97abbe; --line:#25394d;
  --primary:#6aa9ee; --primary-ink:#06172a; --primary-soft:#1b3550;
  --signal:#ffaa3b; --signal-soft:#3a2a12;
  --ok:#5ccf74; --ok-soft:#173523; --bad:#ff7676; --bad-soft:#3d1d1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1824; --surface:#142434; --sunk:#0f1d2b; --ink:#e3ecf4; --muted:#97abbe; --line:#25394d;
  --primary:#6aa9ee; --primary-ink:#06172a; --primary-soft:#1b3550;
  --signal:#ffaa3b; --signal-soft:#3a2a12;
  --ok:#5ccf74; --ok-soft:#173523; --bad:#ff7676; --bad-soft:#3d1d1f; color-scheme:dark}
:root.proj{--scale:1.22}
html{font-size:calc(15px * var(--scale))}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.65;font-size:1rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance;line-height:1.3;margin:0}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.15rem;letter-spacing:.02em;text-decoration:none;color:var(--ink)}
.brand svg{flex:none}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:700;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.top .sp{flex:1}
.tbtn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:8px;font-size:.85rem;font-weight:500}
.tbtn[aria-pressed="true"]{background:var(--signal-soft);border-color:var(--signal)}
.wire{height:3px;background:repeating-linear-gradient(90deg,var(--primary) 0 18px,transparent 18px 26px,var(--signal) 26px 34px,transparent 34px 42px);opacity:.55}

/* shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;max-width:1280px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;display:flex;flex-direction:column;gap:4px}
.rail .grp{font-size:.75rem;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:12px 8px 4px}
.rail a{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.93rem;line-height:1.35}
.rail a:hover{background:var(--sunk)}
.rail a[aria-current="page"]{background:var(--primary-soft);color:var(--ink);font-weight:700}
.rail a .code{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);min-width:2.6em;flex:none}
.rail a[aria-current="page"] .code{color:var(--primary)}
main{min-width:0}

/* headings */
.eyebrow{font-size:.78rem;letter-spacing:.14em;color:var(--signal);font-weight:700}
.h1{font-size:clamp(1.6rem,3.4vw,2.3rem);font-weight:900;letter-spacing:.01em}
.lead{color:var(--muted);max-width:68ch;margin-top:8px}
.pagehd{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:500}
.chip.p{background:var(--primary-soft);color:var(--primary)}
.chip.s{background:var(--signal-soft);color:var(--signal)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 16px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}

/* cards & blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:16px}
.h3{font-size:1.08rem;font-weight:700;display:flex;align-items:center;gap:8px}
.h3 .tag{font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--signal)}
ul.pts{margin:8px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
ul.pts li::marker{color:var(--signal)}
.flow{display:flex;flex-direction:column;margin-top:8px}
.flow .row{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
.flow .row:first-child{border-top:0}
.flow .min{font-family:var(--f-mono);font-weight:700;color:var(--primary);font-size:.9rem}
.flow .row b{display:block}
.flow .row span{color:var(--muted);font-size:.92rem}
.myth{display:grid;gap:4px;padding:10px 0;border-top:1px dashed var(--line)}
.myth:first-of-type{border-top:0}
.myth .q{font-weight:700;color:var(--bad)}
.myth .a{color:var(--ink)}
.note{background:var(--signal-soft);border-radius:8px;padding:10px 14px;font-size:.92rem}
.unitcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:border-color .15s,transform .15s}
.unitcard:hover{border-color:var(--primary);transform:translateY(-2px)}
.unitcard .code{font-family:var(--f-mono);font-size:.8rem;color:var(--primary);font-weight:700}
.unitcard h3{font-size:1.05rem}
.unitcard .meta{font-size:.82rem;color:var(--muted)}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.steps li{list-style:none;counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.steps li::before{content:counter(s);display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--signal);color:#fff;font-weight:900;margin-bottom:6px;font-family:var(--f-mono)}
.steps li b{display:block}
.steps li span{font-size:.9rem;color:var(--muted)}

/* activity picker */
.actpick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.actpick button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.9rem;display:flex;gap:6px;align-items:center}
.actpick button .k{font-size:.7rem;font-weight:700;color:var(--muted);letter-spacing:.06em}
.actpick button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.acthd{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.acthd h3{font-size:1.2rem;font-weight:900}
.acthd p{color:var(--muted);max-width:75ch}
.ask{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:.92rem;background:var(--primary-soft);border-radius:8px;padding:10px 14px}
.ask b{color:var(--primary);flex:none}

/* buttons */
.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:700;background:var(--primary);color:var(--primary-ink);display:inline-flex;gap:6px;align-items:center}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sig{background:var(--signal);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:500}
input[type=text],input[type=number],select{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
input[type=range]{accent-color:var(--signal)}
.ctrls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px}

/* quiz */
.qcard{display:flex;flex-direction:column;gap:14px}
.qprog{display:flex;gap:5px;flex-wrap:wrap}
.qprog i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.qprog i.cur{background:var(--primary)}
.qprog i.ok{background:var(--ok)}
.qprog i.no{background:var(--bad)}
.qtext{font-size:1.2rem;font-weight:700;line-height:1.5}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);padding:11px 14px;border-radius:9px;font-size:1rem}
.opt .lt{font-family:var(--f-mono);font-weight:700;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--sunk);flex:none;font-size:.85rem}
.opt:hover:not(:disabled){border-color:var(--primary)}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.expl{border-left:4px solid var(--ok);background:var(--sunk);padding:10px 14px;border-radius:0 8px 8px 0}
.expl.no{border-left-color:var(--bad)}
.expl b{display:block}
.score{display:flex;align-items:baseline;gap:10px}
.score .n{font-size:3.2rem;font-weight:900;font-family:var(--f-mono);line-height:1}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:.9rem}
.bar .tr{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar .fl{height:100%;background:var(--primary);border-radius:6px}
.bar .fl.lo{background:var(--bad)}
.bar .v{font-family:var(--f-mono);text-align:right}
.exq{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.exq .qn{font-family:var(--f-mono);color:var(--muted);font-size:.85rem}
.exq .qtext{font-size:1.05rem}
.exq .opt{padding:8px 12px;font-size:.95rem}

/* matching */
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px}
.match .col{display:flex;flex-direction:column;gap:8px}
.match .colhd{font-size:.8rem;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.mi{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px;text-align:left;font-size:.95rem;min-height:48px}
.mi.l{font-weight:700}
.mi.sel{border-color:var(--primary);background:var(--primary-soft)}
.mi.done{border-color:var(--ok);background:var(--ok-soft);cursor:default}
.mi.shake{animation:shake .35s;border-color:var(--bad);background:var(--bad-soft)}
.mi .pn{font-family:var(--f-mono);font-size:.75rem;color:var(--ok);margin-right:6px}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.status{font-size:.92rem;color:var(--muted);margin-top:12px}
.status.ok{color:var(--ok);font-weight:700}

/* sequence */
.seqpool,.seqans{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:10px;border-radius:9px}
.seqpool{background:var(--sunk)}
.seqans{border:2px dashed var(--line);flex-direction:column}
.seqit{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;text-align:left}
.seqit .y{font-family:var(--f-mono);font-weight:700;color:var(--primary);margin-right:8px}
.seqit.ok{border-color:var(--ok);background:var(--ok-soft)}
.seqit.no{border-color:var(--bad);background:var(--bad-soft)}

/* home network */
.hn{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;align-items:center}
.hn .node{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.hn .slot{width:100%;min-height:118px;border:2px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;background:var(--surface)}
.hn .slot.sel{border-color:var(--primary);background:var(--primary-soft)}
.hn .slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.hn .slot.no{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.hn .slot .ph{font-size:.82rem;color:var(--muted)}
.hn .cap{font-size:.78rem;color:var(--muted);line-height:1.35}
.hnwrap{display:flex;flex-direction:column;gap:6px}
.hnline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));font-size:.72rem;color:var(--muted);text-align:center}
.conn{height:4px;background:var(--line);border-radius:2px;position:relative}
.hn .link{display:flex;align-items:center}
.pal{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.dev{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px 6px 6px;font-weight:700;font-size:.92rem}
.dev.sel{border-color:var(--signal);background:var(--signal-soft)}
.dev.used{opacity:.4}
.flowing{background:repeating-linear-gradient(90deg,var(--signal) 0 10px,transparent 10px 18px)!important;background-size:36px 4px!important;animation:flow .6s linear infinite}
@keyframes flow{to{background-position:36px 0}}
@media (max-width:720px){
  .hn{grid-template-columns:minmax(0,1fr)}
  .hnline{display:none}
}

/* home network 9-col */
.hn2{grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr) 22px minmax(0,1fr) 22px minmax(0,1fr) 22px minmax(0,1fr)}
.hnrow2 .node{gap:0}
.vlink{width:4px;height:22px;background:var(--line);border-radius:2px}
.conn.wl{background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 11px)}
.hn .link .conn{width:100%}
@media (max-width:720px){
  .hn2{grid-template-columns:minmax(0,1fr)}
  .hn .link{height:20px;justify-content:center}
  .hn .link .conn{width:4px;height:100%}
  .hnrow2 > div:empty{display:none}
}
/* sims generic */
.simbox{background:var(--sunk);border-radius:var(--r);padding:12px;overflow-x:auto}
.simbox svg{display:block;width:100%;height:auto;min-width:560px}
.svgtext{fill:var(--ink);font-family:var(--f-body)}
.svgmuted{fill:var(--muted);font-family:var(--f-body)}
.lg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pk{font-family:var(--f-mono);font-size:.82rem;border-radius:6px;padding:3px 8px;background:var(--surface);border:1.5px solid var(--line)}
.pk.ok{border-color:var(--ok);background:var(--ok-soft)}
.pk.bad{border-color:var(--bad);background:var(--bad-soft)}
.pk.wait{border-style:dashed;color:var(--muted)}
.pk.re{border-color:var(--signal);background:var(--signal-soft)}
.log{font-size:.85rem;font-family:var(--f-mono);display:flex;flex-direction:column;gap:2px;max-height:150px;overflow:auto;margin-top:10px;color:var(--muted)}
.log div:first-child{color:var(--ink)}
.side2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:12px}
@media (max-width:640px){.side2{grid-template-columns:minmax(0,1fr)}.match{grid-template-columns:minmax(0,1fr)}}
.boxt{font-size:.8rem;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.hdr{display:flex;flex-wrap:wrap;font-family:var(--f-mono);font-size:.8rem;border-radius:8px;overflow:hidden;border:1.5px solid var(--line);width:max-content;max-width:100%}
.hdr span{padding:5px 10px;border-right:1px solid var(--line)}
.hdr span:last-child{border-right:0}
.big{font-size:1.4rem;font-weight:900}
.octs{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;margin-top:10px}
.oct{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:6px 10px}
.oct .d{font-family:var(--f-mono);font-size:1.3rem;font-weight:700}
.oct .b{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);letter-spacing:.05em}
.oct.bad{border-color:var(--bad);background:var(--bad-soft)}
.verdict{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-weight:900;margin-top:12px}
.verdict.pub{background:var(--primary-soft);color:var(--primary)}
.verdict.pri{background:var(--signal-soft);color:var(--signal)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.v6{font-family:var(--f-mono);font-size:1.15rem;font-weight:700;word-break:break-all;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 14px}
.v6in{font-family:var(--f-mono);font-size:1.05rem;width:100%}
.parts{display:flex;flex-wrap:wrap;gap:4px;align-items:stretch;margin-top:12px}
.part{display:flex;flex-direction:column;align-items:center;border-radius:8px;padding:6px 10px;min-width:44px}
.part .t{font-family:var(--f-mono);font-size:1.15rem;font-weight:700}
.part .l{font-size:.75rem;font-weight:700}
.part .x{font-size:.72rem;opacity:.85}
.part.dot{padding:6px 0;min-width:0;justify-content:center}
.c1{background:#dbe8fb;color:#163f78}.c2{background:#fde3c6;color:#7a3d00}.c3{background:#d9f1df;color:#1c5a2c}.c4{background:#efdcf7;color:#5b2477}.c5{background:#e4e7eb;color:#33404d}.c6{background:#fbdada;color:#7b1d1d}
:root[data-theme="dark"] .c1{background:#1d3a5e;color:#cfe2ff}:root[data-theme="dark"] .c2{background:#4a2e10;color:#ffd9ad}:root[data-theme="dark"] .c3{background:#1c4026;color:#c6f0d1}:root[data-theme="dark"] .c4{background:#3e2350;color:#ecd2fb}:root[data-theme="dark"] .c5{background:#2b3540;color:#d4dbe2}:root[data-theme="dark"] .c6{background:#4a1f22;color:#ffd0d0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .c1{background:#1d3a5e;color:#cfe2ff}:root:not([data-theme="light"]) .c2{background:#4a2e10;color:#ffd9ad}:root:not([data-theme="light"]) .c3{background:#1c4026;color:#c6f0d1}:root:not([data-theme="light"]) .c4{background:#3e2350;color:#ecd2fb}:root:not([data-theme="light"]) .c5{background:#2b3540;color:#d4dbe2}:root:not([data-theme="light"]) .c6{background:#4a1f22;color:#ffd0d0}}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:.92rem;margin-top:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.tbl th{font-size:.8rem;color:var(--muted);letter-spacing:.06em}
.tblw{overflow-x:auto}
.inbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;margin-top:12px}
.mail{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.88rem;display:flex;flex-direction:column;gap:3px}
.mail .who{font-weight:900;font-size:.95rem}
.mail .hl{color:var(--muted)}
.mail .bcc{color:var(--signal);font-weight:700}
.crow{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.crow .seg button{padding:4px 10px;font-size:.8rem}
.pmbig{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:12px}
.pmdial{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:900;font-size:1.8rem;color:#111;border:4px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.pmscale{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px;margin-top:12px}
.pmscale div{height:26px;border-radius:4px;font-family:var(--f-mono);font-size:.72rem;display:grid;place-items:center;color:#111;opacity:.45}
.pmscale div.on{opacity:1;outline:2px solid var(--ink)}
.race{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.race .rr{display:grid;grid-template-columns:44px minmax(0,1fr) 110px;gap:10px;align-items:center}
.race .rt{height:22px;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.race .rf{height:100%;width:0;background:var(--primary)}
.race .rf.g5{background:var(--signal)}
canvas.crowd{width:100%;height:auto;display:block;background:var(--surface);border-radius:8px;border:1px solid var(--line)}
.foot{color:var(--muted);font-size:.82rem;margin-top:40px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px;padding-top:12px}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px}
  .rail .grp{display:none}
  .rail a{white-space:nowrap;border:1px solid var(--line);background:var(--surface)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

      'TCP/IP 是協定集，三個主要協定：TCP、IP、UDP。',
      'TCP（傳輸控制協定）：傳送端與接收端不斷確認資料是否送達，沒收到「已收到」的訊息就重傳。可靠但速度較慢，適合需要高可靠性的傳輸。',

function quizFormative(el, qs, title) {
  el.innerHTML = '';
  let order, i, res;
  const start = () => { order = shuffle(qs.map((_, k) => k)); i = 0; res = []; draw(); };
  const draw = () => {
    el.innerHTML = '';
    if (i >= order.length) return end();
    const q = qs[order[i]];
    const isTF = q[1] === TF;
    const optIdx = isTF ? [0, 1] : shuffle(q[1].map((_, k) => k));
    const prog = h('div', { class: 'qprog', 'aria-label': `第 ${i + 1} 題，共 ${order.length} 題` },
      order.map((_, k) => h('i', { class: k < i ? (res[k] ? 'ok' : 'no') : k === i ? 'cur' : '' })));
    const opts = h('div', { class: 'opts' });
    const fb = h('div');
    const next = h('button', { class: 'btn', hidden: true, onclick: () => { i++; draw(); } }, i === order.length - 1 ? '看成績' : '下一題 →');
    optIdx.forEach((oi, k) => {
      const b = h('button', { class: 'opt', onclick: () => {
        const ok = oi === q[2]; res.push(ok);
        $$('.opt', opts).forEach((x, kk) => { x.disabled = true; if (optIdx[kk] === q[2]) x.classList.add('ok'); });
        if (!ok) b.classList.add('no');
        fb.replaceChildren(h('div', { class: 'expl' + (ok ? '' : ' no') }, h('b', null, ok ? '答對了！' : '再想想，正確答案是「' + q[1][q[2]] + '」'), q[3]));
        $$('i', prog)[i].className = ok ? 'ok' : 'no';
        next.hidden = false; next.focus();
      } }, h('span', { class: 'lt' }, isTF ? (k ? '✕' : '○') : LET[k]), q[1][oi]);
      opts.append(b);
    });
    el.append(h('div', { class: 'qcard' },
      h('div', { class: 'btnrow', style: { justifyContent: 'space-between' } }, prog, h('span', { class: 'chip' }, `${i + 1} / ${order.length}`)),
      h('div', { class: 'qtext' }, q[0]), opts, fb, h('div', { class: 'btnrow' }, next)));
  };
  const end = () => {
    const c = res.filter(Boolean).length;
    const wrong = order.filter((_, k) => !res[k]).map(k => qs[k]);
    el.append(h('div', { class: 'qcard' },
      h('div', { class: 'eyebrow' }, title + '｜小測驗結果'),
      h('div', { class: 'score' }, h('span', { class: 'n' }, `${c}/${order.length}`), h('span', null, c === order.length ? '全對！觀念很清楚。' : c >= order.length * 0.7 ? '不錯，看看錯的題目。' : '建議再複習一次重點。')),
      wrong.length ? h('div', { class: 'stack', style: { gap: '8px' } }, h('b', null, '需要再看一次的觀念'), ...wrong.map(q => h('div', { class: 'expl no' }, h('b', null, q[0]), '答案：' + q[1][q[2]] + '。' + q[3]))) : null,
      h('div', { class: 'btnrow' }, h('button', { class: 'btn', onclick: start }, '再做一次（題目重新排序）'))));
  };
  start();
}
